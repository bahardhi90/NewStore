# Put TLS in front of this (Certbot, Cloudflare, ArvanCloud, or a host-level Nginx).
# The upstream must send X-Forwarded-Proto=https so Django knows the request is secure.
upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    location /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
