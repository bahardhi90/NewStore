name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: store
          POSTGRES_USER: store
          POSTGRES_PASSWORD: store
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U store" --health-interval 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DATABASE_URL: postgres://store:store@localhost:5432/store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements/dev.txt
      - name: Lint
        run: |
          black --check .
          isort --check-only .
          flake8
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest --cov=apps --cov-report=term --cov-fail-under=80
      - name: OpenAPI schema is valid
        run: python manage.py spectacular --file schema.yaml --validate --fail-on-warn
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: schema.yaml
