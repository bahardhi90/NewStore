# nginx site for RADA when nginx serves other websites on the same server.
# Forwards radawear.com, www and api to the Docker stack (Caddy on 127.0.0.1:8080).
#
#   sudo cp nginx/radawear.conf /etc/nginx/sites-available/radawear.conf
#   sudo ln -s /etc/nginx/sites-available/radawear.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d radawear.com -d www.radawear.com -d api.radawear.com --redirect
#
# Change radawear.com below if DOMAIN in .env is different, and 8080 if you set CADDY_HTTP_PORT.
server {
    listen 80;
    listen [::]:80;
    server_name radawear.com www.radawear.com api.radawear.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
    }
}
